name: Deploy Backend Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  API_PROJECT: "API/API.csproj"
  PUBLISH_DIR: "${{ github.workspace }}/publish"

jobs:
  build:
    name: Build API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Build backend
        run: dotnet build ${{ env.API_PROJECT }} --configuration Release --no-restore

      - name: Publish backend
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output ${{ env.PUBLISH_DIR }}

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-demo
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    name: Deploy API Demo
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: backend-demo
      url: ${{ steps.deploy.outputs.webapp-url }}

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-demo
          path: ${{ env.PUBLISH_DIR }}

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}

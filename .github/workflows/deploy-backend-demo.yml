name: Deploy Backend Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backend-demo
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  API_PROJECT: "API/API.csproj"
  PUBLISH_DIR: "${{ github.workspace }}/publish"
  PAGES_DIR: "${{ github.workspace }}/demo"
  BACKEND_PAGE_URL: "https://karimtarekdotnet.github.io/Logistics_project/"
  FRONTEND_URL: "https://karimtarekdotnet.github.io/Logistics_Project_Frontend/"

jobs:
  build:
    name: Build API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Build backend
        run: dotnet build ${{ env.API_PROJECT }} --configuration Release --no-restore

      - name: Publish backend
        run: dotnet publish ${{ env.API_PROJECT }} --configuration Release --no-build --output ${{ env.PUBLISH_DIR }}

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-demo
          path: ${{ env.PUBLISH_DIR }}

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: backend-api
      url: ${{ steps.deploy-api.outputs.webapp-url }}

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-demo
          path: ${{ env.PUBLISH_DIR }}

      - name: Deploy API to Azure Web App
        id: deploy-api
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.PUBLISH_DIR }}

  deploy-page:
    name: Deploy backend page
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: backend-demo
      url: https://karimtarekdotnet.github.io/Logistics_project/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backend page
        run: |
          mkdir -p "${PAGES_DIR}"
          cat > "${PAGES_DIR}/index.html" <<EOF
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Logistics Project Backend</title>
              <style>
                :root {
                  color-scheme: light;
                  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  background: #f7f8fb;
                  color: #172033;
                }

                * {
                  box-sizing: border-box;
                }

                body {
                  margin: 0;
                  min-height: 100vh;
                  display: grid;
                  place-items: center;
                  padding: 24px;
                  background: #f7f8fb;
                }

                main {
                  width: min(760px, 100%);
                  padding: 40px;
                  border: 1px solid #d8deea;
                  border-radius: 8px;
                  background: #ffffff;
                  box-shadow: 0 18px 50px rgba(23, 32, 51, 0.10);
                }

                .eyebrow {
                  margin: 0 0 12px;
                  color: #0f766e;
                  font-size: 0.78rem;
                  font-weight: 700;
                  letter-spacing: 0.08em;
                  text-transform: uppercase;
                }

                h1 {
                  margin: 0;
                  font-size: clamp(2rem, 5vw, 3.4rem);
                  line-height: 1.05;
                  letter-spacing: 0;
                }

                p {
                  margin: 18px 0 0;
                  color: #4b5870;
                  font-size: 1.05rem;
                  line-height: 1.7;
                }

                .actions {
                  display: flex;
                  flex-wrap: wrap;
                  gap: 12px;
                  margin-top: 28px;
                }

                a {
                  display: inline-flex;
                  align-items: center;
                  justify-content: center;
                  min-height: 44px;
                  padding: 0 18px;
                  border-radius: 6px;
                  border: 1px solid #c6d0df;
                  color: #172033;
                  font-weight: 700;
                  text-decoration: none;
                }

                a.primary {
                  border-color: #166534;
                  background: #166534;
                  color: #ffffff;
                }

                @media (max-width: 520px) {
                  body {
                    padding: 16px;
                  }

                  main {
                    padding: 28px;
                  }

                  .actions {
                    flex-direction: column;
                  }
                }
              </style>
            </head>
            <body>
              <main>
                <p class="eyebrow">Logistics Project Backend</p>
                <h1>Backend API is deployed</h1>
                <p>
                  This page stays at ${BACKEND_PAGE_URL}. It does not redirect to Swagger.
                  The frontend app is deployed separately and talks to the API deployment.
                </p>
                <div class="actions">
                  <a class="primary" href="${FRONTEND_URL}">Open frontend</a>
                  <a href="https://github.com/KarimTarekDotNet/Logistics_project">View backend repository</a>
                </div>
              </main>
            </body>
          </html>
          EOF
          cp "${PAGES_DIR}/index.html" "${PAGES_DIR}/404.html"

      - name: Publish backend page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages:gh-pages || true

          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git worktree add ../gh-pages gh-pages
          else
            git worktree add --orphan ../gh-pages gh-pages
          fi

          cd ../gh-pages
          git rm -r --ignore-unmatch .
          cp -R "${PAGES_DIR}/." .
          touch .nojekyll
          git add -A

          if git diff --cached --quiet; then
            echo "Backend page is already up to date."
          else
            git commit -m "Deploy backend page"
            git push origin gh-pages
          fi
